services:
  frontend:
    image: ${ECR_REGISTRY}/tripkey-frontend:latest
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${ECR_REGISTRY}/tripkey-backend:latest
    expose:
      - "8080"
    env_file:
      - ./apps/backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AI_ENGINE_URL: http://tripkey-ai-engine:8000
      AI_ENGINE_TIMEOUT_SECONDS: ${AI_ENGINE_TIMEOUT_SECONDS:-90}
      JAVA_OPTS: ${JAVA_OPTS:-}
    depends_on:
      ai-engine:
        condition: service_started
    restart: unless-stopped
    # 컨테이너 liveness 전용: 외부 유료 API(Google Places)를 호출하지 않는 로컬 health 엔드포인트만 사용한다.
    # (이전엔 /v1/trips/destinations/search?q=health 를 30초마다 호출해 무사용 시에도 Places Autocomplete 비용이 발생했다.)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:8080/v1/health' >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai-engine:
    image: ${ECR_REGISTRY}/tripkey-ai-engine:latest
    expose:
      - "8000"
    env_file:
      - ./apps/ai-engine/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${AI_ENGINE_WORKERS:-2}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
