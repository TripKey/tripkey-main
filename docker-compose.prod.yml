services:
  frontend:
    image: ${ECR_REGISTRY}/tripkey-frontend:latest
    build: !reset null
    env_file: !reset []
    ports: !override
      - "80:80"
    volumes: !reset []
    environment: !reset []
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${ECR_REGISTRY}/tripkey-backend:latest
    build: !reset null
    ports: !reset []
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AI_ENGINE_URL: http://tripkey-ai-engine:8000
      AI_ENGINE_TIMEOUT_SECONDS: ${AI_ENGINE_TIMEOUT_SECONDS:-90}
      JAVA_OPTS: ${JAVA_OPTS:-}
    depends_on:
      ai-engine:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:8080/v1/trips/destinations/search?q=health' >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai-engine:
    image: ${ECR_REGISTRY}/tripkey-ai-engine:latest
    build: !reset null
    ports: !reset []
    expose:
      - "8000"
    volumes: !reset []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${AI_ENGINE_WORKERS:-2}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
