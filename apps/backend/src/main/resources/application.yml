spring:
  application:
    name: backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      sqs:
        listener:
          max-concurrent-messages: ${ENRICHMENT_CONCURRENCY:3}
          max-messages-per-poll: ${ENRICHMENT_CONCURRENCY:3}
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080
  servlet:
    context-path: /v1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  default-produces-media-type: application/json

app:
  ai-engine:
    base-url: ${AI_ENGINE_URL:http://tripkey-ai-engine:8000}
    timeout-seconds: ${AI_ENGINE_TIMEOUT_SECONDS:90}
  enrichment:
    sqs:
      queue-name: ${ENRICHMENT_QUEUE_NAME:tripkey-enrichment}
      dlq-name: ${ENRICHMENT_DLQ_NAME:tripkey-enrichment-dlq}
    relay:
      poll-interval-ms: ${ENRICHMENT_RELAY_POLL_MS:2000}
      batch-size: ${ENRICHMENT_RELAY_BATCH_SIZE:10}
      max-attempts: ${ENRICHMENT_RELAY_MAX_ATTEMPTS:5}
