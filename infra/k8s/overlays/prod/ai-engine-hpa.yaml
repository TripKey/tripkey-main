apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tripkey-ai-engine
  labels:
    app.kubernetes.io/name: tripkey
    app.kubernetes.io/component: ai-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tripkey-ai-engine
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
