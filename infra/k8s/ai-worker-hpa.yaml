apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tripkey-ai-worker
  namespace: tripkey
  labels:
    app.kubernetes.io/name: tripkey
    app.kubernetes.io/component: ai-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tripkey-ai-worker
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

