apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tripkey-backend
  namespace: tripkey
  labels:
    app.kubernetes.io/name: tripkey
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tripkey-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
