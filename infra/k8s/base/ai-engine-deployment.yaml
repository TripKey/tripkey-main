apiVersion: apps/v1
kind: Deployment
metadata:
  name: tripkey-ai-engine
  labels:
    app.kubernetes.io/name: tripkey
    app.kubernetes.io/component: ai-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tripkey
      app.kubernetes.io/component: ai-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tripkey
        app.kubernetes.io/component: ai-engine
    spec:
      containers:
        - name: ai-engine
          image: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/tripkey-ai-engine:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tripkey-config
                optional: true
            - secretRef:
                name: tripkey-secrets
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

