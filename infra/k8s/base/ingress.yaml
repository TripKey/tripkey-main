apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tripkey
  labels:
    app.kubernetes.io/name: tripkey
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:400524748280:certificate/7dd0095e-542b-4bc5-a965-8fb7f5083c8c
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=180
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200-399"
    alb.ingress.kubernetes.io/transforms.backend: >
      [
        {
          "type": "url-rewrite",
          "urlRewriteConfig": {
            "rewrites": [
              {
                "regex": "^/api/(.+)$",
                "replace": "/v1/$1"
              }
            ]
          }
        }
      ]
spec:
  ingressClassName: alb
  rules:
    - host: usetripkey.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tripkey-frontend
                port:
                  number: 80
