apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: tripkey
    app.kubernetes.io/component: backend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /v1/health
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tripkey
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
